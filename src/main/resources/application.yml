spring:
  application:
    name: api
  profiles:
    # SPRING_PROFILES_ACTIVE には環境名（local / pr / dev / test / stg / prod）を指定する
    #   設定は環境名ではなく、動き方の単位（aws / dynamodb-local）でまとめる
    #   環境ごとの値（テーブル名・KMS の鍵等）はファイルに書かず、環境変数で渡す
    group:
      local:
        - dynamodb-local
      pr:
        - aws
        - dynamodb-local
      dev:
        - aws
      test:
        - aws
      stg:
        - aws
      prod:
        - aws

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # /healthz はリバースプロキシ（NGINX）が先に応答するため、ヘルスチェックは /actuator/health を使う
        include: health

sandbox:
  aws:
    region: ap-northeast-1
  otpauth:
    # 認証アプリに表示されるサービスの名前。同じ端末に複数の環境を登録しても見分けられるよう、環境名を付ける
    #   prod だけは sandbox（application-prod.yml。利用者に見せる名前のため）
    issuer: sandbox-${sandbox.environment.app-env}
