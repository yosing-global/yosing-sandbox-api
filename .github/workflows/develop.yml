name: develop

# develop へのマージ：ビルド（イメージの push）→ dev と test へのデプロイ・ヘルスチェック（並べて動かす）
#   → test に E2E → テストのユーザーの掃除（dev・test）
#   test は web の CI もデプロイ・E2E を流すが、web と api の間で排他しない（重なって落ちたらやり直す。e2e の CLAUDE.md）
on:
  push:
    branches:
      - develop
    # ドキュメント（*.md）だけの変更では動かさない（コードと一緒に変わったときは動く）
    paths-ignore:
      - "**.md"

permissions:
  contents: read

# 止めずに順番に流す（デプロイを途中で止めない。待っている実行は最新の1つだけ残る）
concurrency:
  group: develop
  cancel-in-progress: false

jobs:
  # sync-develop.yml が develop を main まで早送りした push では動かさない（中身は develop で確かめ済み。dev・test へのデプロイをし直さない）
  #   後ろのジョブは、このジョブを needs で待つため、一緒に飛ばされる
  build:
    if: github.actor != 'yosing-global-sync-develop[bot]'
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  deploy-dev:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      app_env: dev
      role_env: dev
      image_tag: ${{ needs.build.outputs.image_tag }}

  deploy-test:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      app_env: test
      role_env: test
      image_tag: ${{ needs.build.outputs.image_tag }}

  # test に E2E を流す（yosing-sandbox-e2e の再利用できるワークフロー。web の CI と同じ形）
  #   E2E の版は develop（test の web は develop のもの。api も、同じ環境の web を相手にするので同じ版）
  #   ジョブに environment: を付けない（OIDC の sub が変わり、CI ロールに入れなくなる）
  #   ロールの ARN は secrets の側で渡す（secret の値はログで最初から伏せられる）
  e2e:
    needs: deploy-test
    uses: yosing-global/yosing-sandbox-e2e/.github/workflows/e2e.yml@develop
    permissions:
      contents: read
      id-token: write
    with:
      app_env: test
      e2e_ref: develop
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

  # E2E が作ったテストのユーザーの掃除（登録から24時間を過ぎた e2e_dummy_ のユーザー）
  #   E2E の成否にかかわらず最後に動かす（取り消したときは動かさない）。失敗しても、デプロイは取り消さない
  #   dev は web の PR の E2E のユーザーが溜まる（web の PR 環境は dev の API を呼ぶ）
  #   デプロイが成功したときだけ（タスク定義の最新が、掃除の処理を持つイメージであるように）
  cleanup:
    needs:
      - deploy-dev
      - deploy-test
      - e2e
    if: ${{ !cancelled() && needs.deploy-dev.result == 'success' && needs.deploy-test.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        app_env:
          - dev
          - test
    uses: ./.github/workflows/_cleanup.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      app_env: ${{ matrix.app_env }}
