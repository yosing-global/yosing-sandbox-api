name: main

# main へのマージ：ビルド（main-<ハッシュ> のイメージの push）→ stg へのデプロイ・ヘルスチェック → テストのユーザーの掃除（stg）
#   stg と prod は同じイメージ（main-<ハッシュ>）を使う。prod へのデプロイは prod.yml（手動。stg で成功したコミットだけ）
#   AWS は Stg のアカウント。ロールの ARN は Secrets の AWS_ROLE_ARN_STG（OIDC の sub は ref:refs/heads/main。ジョブに environment: を付けない）
#   stg が止まっている（aws-infra-env の stop.yml）ときは、デプロイで失敗する。start.yml で起動してから Re-run する
#   E2E（e2e の e2e.yml@main）は、e2e の stg 対応の後に、デプロイと掃除の間に足す
on:
  push:
    branches:
      - main
    # ドキュメント（*.md）だけの変更では動かさない（コードと一緒に変わったときは動く）
    paths-ignore:
      - "**.md"

permissions:
  contents: read

# 止めずに順番に流す（デプロイを途中で止めない。待っている実行は最新の1つだけ残る）
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_STG }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
    permissions:
      contents: read
      id-token: write
    with:
      tag_prefix: main-

  deploy-stg:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_STG }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
    permissions:
      contents: read
      id-token: write
    with:
      app_env: stg
      role_env: stg
      image_tag: ${{ needs.build.outputs.image_tag }}

  # E2E が作ったテストのユーザーの掃除（登録から24時間を過ぎた e2e_dummy_ のユーザー）
  #   デプロイが成功したときだけ（タスク定義の最新が、掃除の処理を持つイメージであるように）。失敗しても、デプロイは取り消さない
  cleanup:
    needs: deploy-stg
    uses: ./.github/workflows/_cleanup.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_STG }}
    permissions:
      contents: read
      id-token: write
    with:
      app_env: stg
